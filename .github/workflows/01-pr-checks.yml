name: PR Quality & Security Gates

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]
  push:
    branches: [main]

concurrency:
  group: pr-check-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io

jobs:
  # Job 1: Dependency Install + Cache (foundation for all jobs)
  setup:
    name: Setup & Cache Dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
            client-portal/node_modules
            brandiscode/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          npm ci --workspaces --if-present
          cd client-portal && npm ci
          cd ../brandiscode && npm ci || true

  # Job 2: Linting
  lint:
    name: Lint & Code Quality
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
            client-portal/node_modules
            brandiscode/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}

      - name: Run ESLint
        run: |
          cd client-portal
          npm run lint
          echo "✅ ESLint passed"

      - name: Lint Failure Summary
        if: failure()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## ❌ ESLint Failed
          
          Linting issues detected. Please review and fix.
          EOF

  # Job 3: Type Checking
  typecheck:
    name: Type Safety Check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
            client-portal/node_modules
            brandiscode/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}

      - name: Run TypeScript compiler
        run: cd client-portal && npx tsc --noEmit

  # Job 4: Onboarding Scenario Tests
  test:
    name: Onboarding Scenario Tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
            client-portal/node_modules
            brandiscode/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}

      - name: Run tests
        run: |
          cd client-portal
          npm test
          echo "✅ Scenario tests passed"

  # Job 5: Build
  build:
    name: Build Artifact
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
            client-portal/node_modules
            brandiscode/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}

      - name: Build client-portal
        run: cd client-portal && npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: build-client-portal
          path: client-portal/.next
          retention-days: 1

  # Job 6: Dependency Vulnerability Scan
  dependency-check:
    name: Dependency Vulnerability Scan
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
            client-portal/node_modules
            brandiscode/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}

      - name: Run npm audit
        run: |
          cd client-portal
          npm audit --audit-level=moderate 2>&1 | tee audit-report.txt || EXIT_CODE=$?
          if [ ! -z "$EXIT_CODE" ] && [ "$EXIT_CODE" -gt 0 ]; then
            echo "⚠️ Audit failed with code $EXIT_CODE"
            cat audit-report.txt
            exit 1
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: npm-audit-report
          path: client-portal/audit-report.txt
          retention-days: 3  # Remove sensitive data quickly

  # Job 7: Secret Scanning
  secret-scan:
    name: Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog (secret scan)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Run GitGuardian
        uses: GitGuardian/ggshield-action@v1
        if: always()
        # TIJDELIJK niet-blokkerend: GITGUARDIAN_API_KEY nog niet geconfigureerd. Verwijder continue-on-error zodra een geldige sleutel als repo-secret staat.
        continue-on-error: true
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  # Job 8: Database Migration Safety Check
  migration-check:
    name: Database Migration Safety Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate migration files
        run: |
          FAILED=0
          for migration in client-portal/supabase/migration-*.sql; do
            if [ -f "$migration" ]; then
              echo "Checking migration: $migration"
              
              # Check for destructive patterns
              if grep -E "(DROP TABLE|DROP COLUMN|DELETE FROM|TRUNCATE)" "$migration" > /dev/null; then
                if ! grep -E "(-- MIGRATION PURPOSE:|-- ROLLBACK:|-- RISICO:)" "$migration" > /dev/null; then
                  echo "❌ FAILED: Destructive operation detected but no metadata. Add comments:"
                  echo "   -- MIGRATION PURPOSE: <reason>"
                  echo "   -- RISICO: <risk assessment>"
                  echo "   -- ROLLBACK: <rollback instructions>"
                  FAILED=1
                fi
              fi
              
              # Check for rename operations
              if grep -E "ALTER TABLE.* RENAME" "$migration" > /dev/null; then
                echo "⚠️  Rename detected: ensure expand-and-contract pattern is used"
              fi
              
              # Ensure validatie query present
              if ! grep -E "SELECT \* FROM" "$migration" > /dev/null; then
                echo "⚠️  Consider adding validation SELECT statement"
              fi
            fi
          done
          
          if [ $FAILED -eq 1 ]; then
            exit 1
          fi

      - name: Migration Summary
        if: always()
        run: |
          MIGRATION_COUNT=$(find client-portal/supabase -name "migration-*.sql" -type f 2>/dev/null | wc -l)
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ✅ Migration Safety Check
          
          Migrations found: **${MIGRATION_COUNT}**
          
          All validated for destructive operations & required metadata.
          EOF

  # Job 9: RFC Governance Check
  rfc-governance-check:
    name: RFC Governance Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate RFC references to RFC-0001
        run: |
          FAILED=0
          for file in $(find docs -maxdepth 1 -type f -name 'RFC-*.md' ! -name 'RFC-0001*.md' 2>/dev/null); do
            echo "Checking RFC reference: $file"
            if ! grep -q "RFC-0001" "$file"; then
              echo "❌ $file mist verplichte referentie naar RFC-0001"
              FAILED=1
            fi
          done

          if [ $FAILED -eq 1 ]; then
            exit 1
          fi
          echo "✅ RFC governance check passed"

  # Summary: all quality gates must pass
  quality-gates-summary:
    name: Quality Gates Summary
    if: always()
    needs: [lint, typecheck, test, build, dependency-check, secret-scan, migration-check, rfc-governance-check]
    runs-on: ubuntu-latest
    steps:
      - name: Check all gates passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.dependency-check.result }}" != "success" ]] || \
             [[ "${{ needs.secret-scan.result }}" != "success" ]] || \
             [[ "${{ needs.migration-check.result }}" != "success" ]] || \
             [[ "${{ needs.rfc-governance-check.result }}" != "success" ]]; then
            echo "❌ Quality gates FAILED"
            exit 1
          fi
          echo "✅ All quality gates PASSED"

      - name: Write PR quality summary
        if: always()
        run: |
          echo "## PR Quality & Security Gates" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Scenario Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependencies | ${{ needs.dependency-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migrations | ${{ needs.migration-check.result }} |" >> $GITHUB_STEP_SUMMARY
           echo "| RFC Governance | ${{ needs.rfc-governance-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.lint.result }}" == "success" ]] && \
             [[ "${{ needs.typecheck.result }}" == "success" ]] && \
             [[ "${{ needs.build.result }}" == "success" ]] && \
             [[ "${{ needs.dependency-check.result }}" == "success" ]] && \
             [[ "${{ needs.secret-scan.result }}" == "success" ]] && \
             [[ "${{ needs.migration-check.result }}" == "success" ]] && \
             [[ "${{ needs.rfc-governance-check.result }}" == "success" ]]; then
            echo "**Result**: ✅ ALL PASSED — merge allowed" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Result**: ❌ FAILED — fix required before merge" >> $GITHUB_STEP_SUMMARY
          fi
