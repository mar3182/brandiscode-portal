name: PR Quality & Security Gates

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]

concurrency:
  group: pr-check-${{ github.head_ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io

jobs:
  # Job 1: Dependency Install + Cache (foundation for all jobs)
  setup:
    name: Setup & Cache Dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
            client-portal/node_modules
            brandiscode/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          npm ci --workspaces --if-present
          cd client-portal && npm ci
          cd ../brandiscode && npm ci || true

  # Job 2: Linting
  lint:
    name: Lint & Code Quality
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
            client-portal/node_modules
            brandiscode/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}

      - name: Run ESLint
        run: cd client-portal && npm run lint 2>&1 | tee lint-report.txt || true
        continue-on-error: true

      - name: Comment lint results
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Linting issues detected** — please review and fix.'
            })

  # Job 3: Type Checking
  typecheck:
    name: Type Safety Check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
            client-portal/node_modules
            brandiscode/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}

      - name: Run TypeScript compiler
        run: cd client-portal && npx tsc --noEmit

  # Job 4: Unit Tests
  test:
    name: Unit Tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
            client-portal/node_modules
            brandiscode/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}

      - name: Run tests
        run: cd client-portal && npm test 2>&1 || true
        continue-on-error: true

  # Job 5: Build
  build:
    name: Build Artifact
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
            client-portal/node_modules
            brandiscode/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}

      - name: Build client-portal
        run: cd client-portal && npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: build-client-portal
          path: client-portal/.next
          retention-days: 1

  # Job 6: Dependency Vulnerability Scan
  dependency-check:
    name: Dependency Vulnerability Scan
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
            client-portal/node_modules
            brandiscode/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}

      - name: Run npm audit
        run: |
          cd client-portal
          npm audit --audit-level=moderate 2>&1 | tee audit-report.txt || EXIT_CODE=$?
          if [ ! -z "$EXIT_CODE" ] && [ "$EXIT_CODE" -gt 0 ]; then
            echo "⚠️ Audit failed with code $EXIT_CODE"
            cat audit-report.txt
            exit 1
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: npm-audit-report
          path: client-portal/audit-report.txt
          retention-days: 3  # Remove sensitive data quickly

  # Job 7: Secret Scanning
  secret-scan:
    name: Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog (secret scan)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Run GitGuardian
        uses: GitGuardian/ggshield-action@v1
        if: always()
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        with:
          path: ./
          enable-infra-scans: true

  # Job 8: Database Migration Safety Check
  migration-check:
    name: Database Migration Safety Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate migration files
        run: |
          FAILED=0
          for migration in supabase/migration-*.sql; do
            if [ -f "$migration" ]; then
              echo "Checking migration: $migration"
              
              # Check for destructive patterns
              if grep -E "(DROP TABLE|DROP COLUMN|DELETE FROM|TRUNCATE)" "$migration" > /dev/null; then
                if ! grep -E "(-- MIGRATION PURPOSE:|-- ROLLBACK:|-- RISICO:)" "$migration" > /dev/null; then
                  echo "❌ FAILED: Destructive operation detected but no metadata. Add comments:"
                  echo "   -- MIGRATION PURPOSE: <reason>"
                  echo "   -- RISICO: <risk assessment>"
                  echo "   -- ROLLBACK: <rollback instructions>"
                  FAILED=1
                fi
              fi
              
              # Check for rename operations
              if grep -E "ALTER TABLE.* RENAME" "$migration" > /dev/null; then
                echo "⚠️  Rename detected: ensure expand-and-contract pattern is used"
              fi
              
              # Ensure validatie query present
              if ! grep -E "SELECT \* FROM" "$migration" > /dev/null; then
                echo "⚠️  Consider adding validation SELECT statement"
              fi
            fi
          done
          
          if [ $FAILED -eq 1 ]; then
            exit 1
          fi

      - name: Comment migration status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const migrations = fs.readdirSync('supabase')
              .filter(f => f.match(/^migration-.*\.sql$/))
              .length;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Migration Check**: ${migrations} migrations found and validated`
            })

  # Summary: all quality gates must pass
  quality-gates-summary:
    name: Quality Gates Summary
    if: always()
    needs: [lint, typecheck, test, build, dependency-check, secret-scan, migration-check]
    runs-on: ubuntu-latest
    steps:
      - name: Check all gates passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.dependency-check.result }}" != "success" ]] || \
             [[ "${{ needs.secret-scan.result }}" != "success" ]] || \
             [[ "${{ needs.migration-check.result }}" != "success" ]]; then
            echo "❌ Quality gates FAILED"
            exit 1
          fi
          echo "✅ All quality gates PASSED"

      - name: Create check summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `
            ## ✅ PR Quality & Security Gates

            | Gate | Status |
            |------|--------|
            | Lint | ${{ needs.lint.result }} |
            | Type Check | ${{ needs.typecheck.result }} |
            | Tests | ${{ needs.test.result }} |
            | Build | ${{ needs.build.result }} |
            | Dependencies | ${{ needs.dependency-check.result }} |
            | Secrets | ${{ needs.secret-scan.result }} |
            | Migrations | ${{ needs.migration-check.result }} |

            **Merge allowed**: \`\`\`${{ needs.quality-gates-summary.result == 'success' ? 'YES ✅' : 'NO ❌' }}\`\`\`
            `
            })
